name: Synthetic application runtime boundaries

on:
  pull_request:
    paths:
      - 'rehearsal/application/**'
      - 'rehearsal/restore/**'
      - 'rehearsal/run-synthetic.py'
      - 'backend/**'
      - '.github/workflows/synthetic-application-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'rehearsal/application/**'
      - 'rehearsal/restore/**'
      - 'rehearsal/run-synthetic.py'
      - 'backend/**'
      - '.github/workflows/synthetic-application-runtime.yml'

permissions:
  contents: read

jobs:
  boundaries:
    name: Owned runtime fences and real-client protocol contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.10'
          cache-dependency-path: backend/go.sum
      - name: Test default refusal and ownership boundaries without Docker
        run: python3 -B -W error::ResourceWarning -m unittest discover -s rehearsal/application -p 'test_runtime_boundary.py' -v
      - name: Verify pinned clients against invented loopback protocols
        env:
          RUN_SYNTHETIC_PROTOCOL_CONTRACT_TESTS: '1'
        run: python3 -B -W error::ResourceWarning -m unittest discover -s rehearsal/application -p 'test_protocol_contract.py' -v
      # No production secrets, Docker execution, registry publication or upload.
