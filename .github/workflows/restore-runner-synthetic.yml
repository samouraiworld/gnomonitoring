name: Isolated restore synthetic validation

on:
  pull_request:
    paths:
      - 'rehearsal/restore/**'
      - 'rehearsal/run-synthetic.py'
      - 'rehearsal/render_volume_template.go'
      - 'rehearsal/Dockerfile.initdb'
      - 'backend/**'
      - '.github/workflows/restore-runner-synthetic.yml'
  push:
    branches: [main]
    paths:
      - 'rehearsal/restore/**'
      - 'rehearsal/run-synthetic.py'
      - 'rehearsal/render_volume_template.go'
      - 'rehearsal/Dockerfile.initdb'
      - 'backend/**'
      - '.github/workflows/restore-runner-synthetic.yml'

permissions:
  contents: read

jobs:
  synthetic:
    name: Restore invented archives without runtime networking
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.10'
          cache-dependency-path: backend/go.sum
      - name: Test restore boundaries before integration
        run: python3 -B -W error::ResourceWarning -m unittest discover -s rehearsal/restore -p 'test_runner_boundary.py' -v
      - name: Test archive fixture boundaries without Docker execution
        run: python3 -B -W error::ResourceWarning -m unittest discover -s rehearsal/restore -p 'test_synthetic_restore.py' -v
      - name: Restore synthetic archives and check cleanup
        env:
          RUN_SYNTHETIC_RESTORE_TESTS: '1'
        run: python3 -B -W error::ResourceWarning -m unittest discover -s rehearsal/restore -p 'test_synthetic_restore.py' -v
      # Dumps, SQL, manifests and private command logs are never uploaded.
