name: Synthetic backup recovery

on:
  pull_request:
    paths:
      - 'ops/backup/**'
      - '.github/workflows/backup-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore:
    name: Encrypted backup and isolated synthetic restore
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOTOOLCHAIN: local
      E2E_ROWS: '1000000'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.10'
          cache: false
      - name: Prepare synthetic test dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y age
          command -v aws docker go age age-keygen curl python3 flock
      - name: Validate shell and run the recovery test
        run: |
          set -euo pipefail
          bash -n ops/backup/pg-backup-scaleway.sh ops/backup/pg-row-counts.sh ops/backup/pg-restore-test.sh ops/backup/e2e-test.sh
          bash ops/backup/e2e-test.sh
