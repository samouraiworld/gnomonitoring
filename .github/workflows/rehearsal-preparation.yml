name: Isolated rehearsal tooling

on:
  pull_request:
    paths:
      - 'backend/cmd/rehearse-initdb/**'
      - 'rehearsal/**'
      - '.github/workflows/rehearsal-preparation.yml'
  push:
    branches: [main]
    paths:
      - 'backend/cmd/rehearse-initdb/**'
      - 'rehearsal/**'
      - '.github/workflows/rehearsal-preparation.yml'

permissions:
  contents: read

jobs:
  synthetic:
    name: Synthetic InitDB isolation and idempotence
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.10'
          cache-dependency-path: backend/go.sum
      - name: Unit and harness boundary checks
        run: |
          (cd backend && go test -race ./cmd/rehearse-initdb)
          python3 -B -m unittest discover -s rehearsal -p 'test_*.py' -v
          bash -n rehearsal/bootstrap-synthetic.sh
          shellcheck rehearsal/bootstrap-synthetic.sh
      - name: Exercise fresh synthetic volumes without runtime networking
        run: |
          output_dir=$(mktemp -d "${RUNNER_TEMP}/rehearsal.XXXXXXXX")
          python3 rehearsal/run-synthetic.py --execute-synthetic --private-output-dir "$output_dir"
      # Private SQL/build logs are intentionally not uploaded as public artifacts.
