name: "DO NOT MERGE - encrypted read-only preflight"
run-name: "Encrypted preflight (${{ github.sha }})"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gnomonitoring-readonly-production-inspection
  cancel-in-progress: false

jobs:
  inspect:
    name: Inspect documented project metadata without deployment
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'samouraiworld/gnomonitoring' &&
      github.ref == 'refs/heads/chore/preflight-readonly-metadata-v2-20261027'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Collect fixed-scope metadata and encrypt it
        id: inventory
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${SSH_HOST:-}" || -z "${SSH_USER:-}" || -z "${SSH_PRIVATE_KEY:-}" ]]; then
            echo 'Required SSH connection secrets are unavailable.' >&2
            exit 1
          fi
          if [[ ! "$SSH_HOST" =~ ^[A-Za-z0-9._:-]+$ || ! "$SSH_USER" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo 'Unexpected SSH connection metadata format.' >&2
            exit 1
          fi
          umask 077
          inspection_dir=$(mktemp -d "${RUNNER_TEMP}/gnomonitoring-inspection.XXXXXXXX")
          key_file=$inspection_dir/identity
          known_hosts_file=$inspection_dir/known_hosts
          inventory_file=$inspection_dir/inventory.json
          error_file=$inspection_dir/private-errors.log
          sealed_dir=$(mktemp -d "${RUNNER_TEMP}/gnomonitoring-sealed.XXXXXXXX")
          cleanup() {
            rm -f -- "$key_file" "$known_hosts_file" "$inventory_file" "$error_file"
            rmdir -- "$inspection_dir"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"
          cat > "$known_hosts_file" <<'TRUSTED_HOST_KEYS'
          gnomonitoring-prod-inspection ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIbkopwdGXdS6c4xUy7kG9uRWF+w1I/mczSeLmMLN82Q
          gnomonitoring-prod-inspection ssh-rsa 
          gnomonitoring-prod-inspection ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBOihyr3TeI90KAIG202gdARL25tM9T+6fFKLoKtB044ST7Rhb5POmhWJgrQKr6sYYOnwLluwY5pTZ7c0xebf0d0=
          TRUSTED_HOST_KEYS
          inspection_host=$SSH_HOST
          inspection_user=$SSH_USER
          unset SSH_HOST SSH_USER SSH_PRIVATE_KEY

          timeout 60s ssh -F /dev/null -T \
            -i "$key_file" -l "$inspection_user" -p 22 \
            -o "UserKnownHostsFile=$known_hosts_file" \
            -o GlobalKnownHostsFile=/dev/null \
            -o HostKeyAlias=gnomonitoring-prod-inspection \
            -o StrictHostKeyChecking=yes -o UpdateHostKeys=no \
            -o IdentitiesOnly=yes -o IdentityAgent=none -o BatchMode=yes \
            -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no \
            -o ConnectTimeout=10 -o ConnectionAttempts=1 \
            -o ServerAliveInterval=5 -o ServerAliveCountMax=2 \
            -o ClearAllForwardings=yes -o PermitLocalCommand=no -o LogLevel=ERROR \
            -- "$inspection_host" 'python3 -I -B -' \
            < .github/scripts/collect_preflight_metadata.py > "$inventory_file" 2> "$error_file"
          python3 - "$inventory_file" <<'CHECK_REPORT'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as source:
              report = json.load(source)
          assert report.get("format_version") == 2
          assert report.get("status") in ("complete", "partial", "failed")
          print("Metadata collection status:", report["status"])
          CHECK_REPORT
          openssl cms -encrypt -aes-256-gcm -binary -outform DER \
            -recip .github/preflight-recipient.pem \
            -keyopt rsa_padding_mode:oaep -keyopt rsa_oaep_md:sha256 \
            -in "$inventory_file" -out "$sealed_dir/inventory.cms" 2>> "$error_file"
          chmod 600 "$sealed_dir/inventory.cms"
          printf 'sealed_path=%s\n' "$sealed_dir/inventory.cms" >> "$GITHUB_OUTPUT"
          echo 'Inventory encrypted; no plaintext metadata is emitted.'
      - name: Retain only encrypted metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preflight-metadata-encrypted-20261027
          path: ${{ steps.inventory.outputs.sealed_path }}
          if-no-files-found: error
          retention-days: 1
