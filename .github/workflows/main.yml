name: "DO NOT MERGE - read-only maintenance metadata"
run-name: "Read-only maintenance metadata (${{ github.sha }})"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gnomonitoring-readonly-maintenance-metadata
  cancel-in-progress: false

jobs:
  boundary:
    name: Verify inspection boundary before SSH
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - run: python3 -B -m unittest discover -s ops/maintenance -p 'test_*.py' -v

  inspect:
    needs: boundary
    name: Read fixed package/runtime/lifecycle metadata only
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'samouraiworld/gnomonitoring' &&
      github.ref == 'refs/heads/chore/monitoring-host-maintenance-audit-20261103'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read fixed backup metadata over pinned SSH
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${SSH_HOST:-}" || -z "${SSH_USER:-}" || -z "${SSH_PRIVATE_KEY:-}" ]]; then
            echo 'Required SSH connection secrets are unavailable.' >&2
            exit 1
          fi
          if [[ ! "$SSH_HOST" =~ ^[A-Za-z0-9._:-]+$ || ! "$SSH_USER" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo 'Unexpected SSH connection metadata format.' >&2
            exit 1
          fi
          umask 077
          inspection_dir=$(mktemp -d "${RUNNER_TEMP}/gnomonitoring-inspection.XXXXXXXX")
          key_file=$inspection_dir/identity
          known_hosts_file=$inspection_dir/known_hosts
          cleanup() {
            rm -f -- "$key_file" "$known_hosts_file"
            rmdir -- "$inspection_dir"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"
          cat > "$known_hosts_file" <<'TRUSTED_HOST_KEYS'
          gnomonitoring-prod-inspection ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIbkopwdGXdS6c4xUy7kG9uRWF+w1I/mczSeLmMLN82Q
          gnomonitoring-prod-inspection ssh-rsa 
          gnomonitoring-prod-inspection ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBOihyr3TeI90KAIG202gdARL25tM9T+6fFKLoKtB044ST7Rhb5POmhWJgrQKr6sYYOnwLluwY5pTZ7c0xebf0d0=
          TRUSTED_HOST_KEYS
          inspection_host=$SSH_HOST
          inspection_user=$SSH_USER
          unset SSH_HOST SSH_USER SSH_PRIVATE_KEY

          timeout 180s ssh -F /dev/null -T \
            -i "$key_file" -l "$inspection_user" -p 22 \
            -o "UserKnownHostsFile=$known_hosts_file" \
            -o GlobalKnownHostsFile=/dev/null \
            -o HostKeyAlias=gnomonitoring-prod-inspection \
            -o StrictHostKeyChecking=yes -o UpdateHostKeys=no \
            -o IdentitiesOnly=yes -o IdentityAgent=none -o BatchMode=yes \
            -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no \
            -o ConnectTimeout=10 -o ConnectionAttempts=1 \
            -o ServerAliveInterval=5 -o ServerAliveCountMax=2 \
            -o ClearAllForwardings=yes -o PermitLocalCommand=no -o LogLevel=ERROR \
            -- "$inspection_host" 'python3 -I -' <<'REMOTE_BACKUP_INVENTORY'
          #!/usr/bin/env python3
          """Fixed read-only package/runtime and backup lifecycle metadata, no secrets."""
          from datetime import datetime, timezone
          import json
          from pathlib import Path
          import re
          import subprocess


          PACKAGES = ("openssh-server", "openssl", "libssl3", "libssl3t64", "libc6", "curl", "docker-ce", "docker-ce-cli",
                      "containerd.io", "age", "unattended-upgrades")
          COMMANDS = {
              "kernel": ("uname", "-r"),
              "docker_server": ("docker", "version", "--format", "{{.Server.Version}}"),
              "compose": ("docker", "compose", "version", "--short"),
              "packages": ("dpkg-query", "-W", "-f=${binary:Package}\t${Version}\n", *PACKAGES),
              "lifecycle": ("aws", "--endpoint-url", "https://s3.fr-par.scw.cloud", "--region", "fr-par",
                            "s3api", "get-bucket-lifecycle-configuration", "--bucket", "gnomonitoring", "--output", "json"),
          }


          def run_command(command):
              if tuple(command) not in COMMANDS.values():
                  raise ValueError("unsupported_read_command")
              try:
                  result = subprocess.run(command, capture_output=True, text=True, timeout=20, check=False)
                  if len(result.stdout) > 1024 * 1024:
                      return 1, ""
                  return result.returncode, result.stdout
              except (OSError, subprocess.TimeoutExpired):
                  return 1, ""


          def lifecycle_summary(data):
              rules = data.get("Rules")
              if not isinstance(rules, list):
                  return {"status": "invalid_response"}
              result = {"status": "ok", "rule_count": len(rules), "postgres_rules": [],
                        "unrelated_rule_count": 0, "unknown_filter_count": 0}
              for rule in rules:
                  if not isinstance(rule, dict):
                      result["unknown_filter_count"] += 1
                      continue
                  selected = rule.get("Filter", {"Prefix": rule.get("Prefix", "")})
                  if not isinstance(selected, dict):
                      result["unknown_filter_count"] += 1
                      continue
                  condition = selected.get("And", selected)
                  if not isinstance(condition, dict):
                      result["unknown_filter_count"] += 1
                      continue
                  prefix = condition.get("Prefix", "")
                  if not isinstance(prefix, str):
                      result["unknown_filter_count"] += 1
                      continue
                  if "postgres/".startswith(prefix):
                      scope = "entire_prefix"
                  elif prefix.startswith("postgres/"):
                      scope = "partial_prefix"
                  else:
                      result["unrelated_rule_count"] += 1
                      continue
                  conditional = bool(set(condition) - {"Prefix"}) or bool(set(selected) - {"Prefix", "And"})
                  expiration = rule.get("Expiration") or {}
                  days = expiration.get("Days") if isinstance(expiration, dict) else None
                  date = expiration.get("Date") if isinstance(expiration, dict) else None
                  result["postgres_rules"].append({"enabled": rule.get("Status") == "Enabled",
                      "scope": scope, "additional_conditions": conditional,
                      "expiration_days": days if isinstance(days, int) and not isinstance(days, bool) else None,
                      "fixed_expiration_date_present": isinstance(date, str),
                      "noncurrent_expiration_present": "NoncurrentVersionExpiration" in rule})
              return result


          def collect(runner=run_command):
              output = {"observed_at": datetime.now(timezone.utc).isoformat(), "read_only": True,
                        "security_advisory_freshness": "not_evaluated", "installed_packages": {}}
              for key in ("kernel", "docker_server", "compose"):
                  code, value = runner(COMMANDS[key])
                  value = value.strip()
                  output[key] = value if code == 0 and re.fullmatch(r"[A-Za-z0-9.+:~_/-]{1,160}", value) else "unavailable"
              code, packages = runner(COMMANDS["packages"])
              if code in (0, 1):
                  for line in packages.splitlines():
                      fields = line.split("\t")
                      if len(fields) == 2:
                          name, version = fields
                          name = name.split(":", 1)[0]
                          if name in PACKAGES and re.fullmatch(r"[A-Za-z0-9.+:~_-]{1,160}", version):
                              output["installed_packages"][name] = version
              output["reboot_required_flag"] = Path("/var/run/reboot-required").exists()
              try:
                  for line in Path("/proc/stat").read_text().splitlines():
                      if re.fullmatch(r"btime [0-9]+", line):
                          output["boot_utc"] = datetime.fromtimestamp(int(line.split()[1]), timezone.utc).isoformat()
                          break
              except OSError:
                  pass
              code, raw = runner(COMMANDS["lifecycle"])
              try:
                  output["backup_lifecycle"] = lifecycle_summary(json.loads(raw)) if code == 0 else {"status": "unavailable"}
              except (ValueError, TypeError, AttributeError):
                  output["backup_lifecycle"] = {"status": "invalid_response"}
              return output


          if __name__ == "__main__":
              print(json.dumps(collect(), sort_keys=True))
          REMOTE_BACKUP_INVENTORY

  synthetic:
    name: Synthetic backup and restore using candidate schema
    needs: boundary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      E2E_ROWS: '1000000'
    steps:
      - name: Check out the release candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ab5d87757d6274fcdebc50b7fd2cf92e9f32904e
          path: candidate
          persist-credentials: false
      - name: Check out the exact backup-tool PR
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: aeed6837471702fe7f8517510f3898df5fc11493
          path: backup-tools
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.10'
          cache: false
      - name: Prepare isolated synthetic tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y age
          command -v aws docker go age age-keygen curl python3 flock
          mkdir -p candidate/ops
          cp -R backup-tools/ops/backup candidate/ops/backup
      - name: Exercise synthetic dump, encryption, upload and restore
        working-directory: candidate
        run: bash ops/backup/e2e-test.sh
