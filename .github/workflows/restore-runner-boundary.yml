name: Isolated restore boundary

on:
  pull_request:
    paths:
      - 'rehearsal/restore/runner.py'
      - 'rehearsal/restore/bootstrap-empty.sh'
      - 'rehearsal/restore/Dockerfile.postgres'
      - 'rehearsal/restore/compose.restore.yml'
      - 'rehearsal/restore/test_runner_boundary.py'
      - 'rehearsal/restore/README.md'
      - 'rehearsal/run-synthetic.py'
      - 'rehearsal/render_volume_template.go'
      - 'rehearsal/Dockerfile.initdb'
      - 'backend/**'
      - '.github/workflows/restore-runner-boundary.yml'
  push:
    branches: [main]
    paths:
      - 'rehearsal/restore/runner.py'
      - 'rehearsal/restore/bootstrap-empty.sh'
      - 'rehearsal/restore/Dockerfile.postgres'
      - 'rehearsal/restore/compose.restore.yml'
      - 'rehearsal/restore/test_runner_boundary.py'
      - 'rehearsal/restore/README.md'
      - 'rehearsal/run-synthetic.py'
      - 'rehearsal/render_volume_template.go'
      - 'rehearsal/Dockerfile.initdb'
      - 'backend/**'
      - '.github/workflows/restore-runner-boundary.yml'

permissions:
  contents: read

jobs:
  boundary:
    name: Restore refusal and isolation boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.10'
          cache: false
      - name: Validate bootstrap syntax
        run: |
          bash -n rehearsal/restore/bootstrap-empty.sh
          shellcheck rehearsal/restore/bootstrap-empty.sh
      - name: Test restore boundaries without Docker execution
        run: python3 -B -W error::ResourceWarning -m unittest discover -s rehearsal/restore -p 'test_runner_boundary.py' -v
      - name: Verify default tools-only invocation
        run: python3 -B rehearsal/restore/runner.py
