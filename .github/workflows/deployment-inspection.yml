name: Deployment inspection tooling

on:
  pull_request:
    paths:
      - 'scripts/inspect-deployment.sh'
      - 'scripts/test_inspect_deployment.py'
      - 'scripts/render_inspection_template.go'
      - '.github/workflows/deployment-inspection.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/inspect-deployment.sh'
      - 'scripts/test_inspect_deployment.py'
      - 'scripts/render_inspection_template.go'
      - '.github/workflows/deployment-inspection.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.10'
          cache: false
      - name: Validate shell
        run: |
          bash -n scripts/inspect-deployment.sh
          shellcheck scripts/inspect-deployment.sh
      - name: Test read-only inspection boundary
        run: python3 -B -m unittest discover -s scripts -p 'test_inspect_deployment.py' -v
