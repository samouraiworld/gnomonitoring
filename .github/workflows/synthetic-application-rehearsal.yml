name: Synthetic application rehearsal

on:
  pull_request:
    paths:
      - 'rehearsal/application/**'
      - 'rehearsal/restore/**'
      - 'rehearsal/run-synthetic.py'
      - 'rehearsal/render_volume_template.go'
      - 'rehearsal/Dockerfile.initdb'
      - 'backend/**'
      - '.github/workflows/synthetic-application-rehearsal.yml'
  push:
    branches: [main]
    paths:
      - 'rehearsal/application/**'
      - 'rehearsal/restore/**'
      - 'rehearsal/run-synthetic.py'
      - 'rehearsal/render_volume_template.go'
      - 'rehearsal/Dockerfile.initdb'
      - 'backend/**'
      - '.github/workflows/synthetic-application-rehearsal.yml'

permissions:
  contents: read

jobs:
  application:
    name: Invented full-backend contracts and owned local return
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.10'
          cache-dependency-path: backend/go.sum
      - name: Test inherited restore and session boundaries
        run: |
          python3 -B -W error::ResourceWarning -m unittest discover -s rehearsal/restore -p 'test_runner_boundary.py' -v
          python3 -B -W error::ResourceWarning -m unittest discover -s rehearsal/restore -p 'test_session_boundary.py' -v
          python3 -B -W error::ResourceWarning -m unittest discover -s rehearsal/restore -p 'test_synthetic_snapshot.py' -v
      - name: Test application and protocol boundaries without Docker execution
        run: python3 -B -W error::ResourceWarning -m unittest discover -s rehearsal/application -p 'test_*.py' -v
      - name: Exercise only invented application data and verify cleanup
        env:
          RUN_SYNTHETIC_APPLICATION_TESTS: '1'
        run: python3 -B -W error::ResourceWarning -m unittest discover -s rehearsal/application -p 'test_synthetic_*.py' -v
      # No registry login/push, production secrets, workflow dispatch, or upload
      # of archives, SQL, configuration, receipts or private command logs.
