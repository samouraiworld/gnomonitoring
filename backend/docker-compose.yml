services:
  postgres:
    image: postgres:16
    container_name: gnomonitoring-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gnomonitoring
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: gnomonitoring
    # Tuned for the daily_participations hot table (several GB, high insert
    # rate). Defaults (shared_buffers=128MB, work_mem=4MB) were sized for a
    # toy dataset: under concurrent metric queries this forced sorts to spill
    # to disk (external merge) and left almost nothing cached, which was a
    # major contributor to a 2026-07-13 production CPU incident. Values below
    # assume a host with several GB of free RAM; shrink shared_buffers if
    # deploying on a smaller box.
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=4GB"
      - "-c"
      - "effective_cache_size=16GB"
      - "-c"
      - "work_mem=64MB"
      - "-c"
      - "maintenance_work_mem=512MB"
    # Docker's default /dev/shm is 64MB, which is exhausted by the DSM
    # segments parallel workers allocate on the GROUP BY / UNION ALL metric
    # queries in db_metrics.go, well before work_mem itself is hit. Raised to
    # match the shared_buffers tier above.
    shm_size: '1gb'
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gnomonitoring -d gnomonitoring"]
      interval: 10s
      timeout: 5s
      retries: 5

  detect-proposal:
    build: .
    restart: on-failure
    container_name: gnomonitoring-backend
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./config_docker.yaml:/app/config.yaml
    ports:
      - "127.0.0.1:8880:8888"
      - "127.0.0.1:8989:8989"
    command: ["./server"]
    networks:
      - default
      - gno-devnet

volumes:
  pgdata:

networks:
  default:
  # Réseau du devnet local (gnoland-test/). Doit être démarré en premier :
  #   cd gnoland-test && docker compose up -d
  # Sans ça, docker compose up échoue car le réseau externe n'existe pas.
  gno-devnet:
    name: gnoland-test_default
    external: true
