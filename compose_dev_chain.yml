# Local end-to-end stack: the gnoland-test devnet (chain id "dev") + gnomonitoring.
#
# Every start is a fresh chain: the one-shot "chain-reset" service wipes the
# validators' state back to block 0 and purges the "dev" rows from the
# database before anything else starts. Use the Makefile wrapper, which tears
# the stack down first so the reset always runs against stopped validators:
#
#   cd gnoland-test && make dev-up      # (re)start from block 0
#   cd gnoland-test && make dev-down
#
# Running it directly from the repository root requires BOTH env files: the
# root .env (POSTGRES_PASSWORD) and gnoland-test/.env (DOCKER_USER, GNO_IMAGE,
# generated by bootstrap.sh), because compose interpolates ${...} before any
# service env_file is read:
#
#   docker compose -f compose_dev_chain.yml --env-file .env --env-file gnoland-test/.env up -d --build
#
# chain-reset refuses to start if gnoland-test/.env was not passed.
#
# Prerequisites (once): the gno-validator image and generated keys/genesis
# ('make full-reinit' in gnoland-test/), and backend/config_dev_chain.yaml
# (copy backend/config_dev_chain.yaml.template).
#
# The project is named "gnoland-test" on purpose: the gnoland-test Makefile
# scenarios (make scenario1..5) drive the same containers by service name.
# Production uses docker-compose-prod.yml instead.
name: gnoland-test

x-validator: &validator
  image: "${GNO_IMAGE:-gno-validator:local}"
  restart: on-failure
  user: "${DOCKER_USER:-1000:1000}"
  # SEEDS_* come from gnoland-test/.env (generated by bootstrap.sh). They are
  # read at container start rather than interpolated here, because this file's
  # own .env is the repository root one.
  env_file: ./gnoland-test/.env
  depends_on:
    chain-reset:
      condition: service_completed_successfully
  # Healthy once the RPC answers AND the chain has produced a block. Consumers
  # wait on this: the backend builds its validator/moniker map once at startup
  # (refreshed only every 5 min), so starting it against a node still loading
  # genesis leaves it ingesting nothing and fires a spurious RPC-outage alert.
  healthcheck:
    test:
      - CMD-SHELL
      - 'wget -qO- http://localhost:26657/status | grep -Eq ''"latest_block_height": *"[1-9]'''
    interval: 5s
    timeout: 3s
    retries: 5
    start_period: 180s
    start_interval: 2s

services:
  chain-reset:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    env_file: ./gnoland-test/.env
    environment:
      # What compose interpolated for the validators, checked by the script
      # against gnoland-test/.env (see the header note on --env-file).
      COMPOSE_DOCKER_USER: ${DOCKER_USER:-1000:1000}
      COMPOSE_GNO_IMAGE: ${GNO_IMAGE:-gno-validator:local}
      PGHOST: postgres
      PGUSER: gnomonitoring
      PGDATABASE: gnomonitoring
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./gnoland-test:/devnet
    entrypoint: ["/bin/sh", "/devnet/dev-chain-reset.sh"]

  validator:
    <<: *validator
    ports:
      - 127.0.0.1:26658:26657
    volumes:
      - ./gnoland-test/entrypoint.sh:/entrypoint.sh:ro
      - ./gnoland-test/validator/config.toml:/gnoroot/config.toml:ro
      - ./gnoland-test/validator/genesis.json:/gnoroot/gnoland-data/genesis.json:ro
      - ./gnoland-test/validator/gnoland-data:/gnoroot/gnoland-data
    entrypoint: ["/bin/sh", "-c", "SEEDS=$$SEEDS_VALIDATOR PERSISTENT_PEERS=$$SEEDS_VALIDATOR exec /entrypoint.sh"]
    environment:
      MONIKER: "samourai-crew-1"
      PEX: "true"

  validator2:
    <<: *validator
    ports:
      - 127.0.0.1:26659:26657
    volumes:
      - ./gnoland-test/entrypoint.sh:/entrypoint.sh:ro
      - ./gnoland-test/validator2/config.toml:/gnoroot/config.toml:ro
      - ./gnoland-test/validator2/genesis.json:/gnoroot/gnoland-data/genesis.json:ro
      - ./gnoland-test/validator2/gnoland-data:/gnoroot/gnoland-data
    entrypoint: ["/bin/sh", "-c", "SEEDS=$$SEEDS_VALIDATOR2 PERSISTENT_PEERS=$$SEEDS_VALIDATOR2 exec /entrypoint.sh"]
    environment:
      MONIKER: "samourai-crew-2"
      PEX: "true"

  validator3:
    <<: *validator
    ports:
      - 127.0.0.1:26660:26657
    volumes:
      - ./gnoland-test/entrypoint.sh:/entrypoint.sh:ro
      - ./gnoland-test/validator3/config.toml:/gnoroot/config.toml:ro
      - ./gnoland-test/validator3/genesis.json:/gnoroot/gnoland-data/genesis.json:ro
      - ./gnoland-test/validator3/gnoland-data:/gnoroot/gnoland-data
    entrypoint: ["/bin/sh", "-c", "SEEDS=$$SEEDS_VALIDATOR3 PERSISTENT_PEERS=$$SEEDS_VALIDATOR3 exec /entrypoint.sh"]
    environment:
      MONIKER: "samourai-crew-3"
      PEX: "true"

  # Kept out of genesis; onboarded by 'make scenario1' (GovDAO proposal).
  validator4:
    <<: *validator
    profiles: ["phase2"]
    ports:
      - 127.0.0.1:26661:26657
    volumes:
      - ./gnoland-test/entrypoint.sh:/entrypoint.sh:ro
      - ./gnoland-test/validator4/config.toml:/gnoroot/config.toml:ro
      - ./gnoland-test/validator4/genesis.json:/gnoroot/gnoland-data/genesis.json:ro
      - ./gnoland-test/validator4/gnoland-data:/gnoroot/gnoland-data
    entrypoint: ["/bin/sh", "-c", "SEEDS=$$SEEDS_VALIDATOR4 PERSISTENT_PEERS=$$SEEDS_VALIDATOR4 exec /entrypoint.sh"]
    environment:
      MONIKER: "samourai-crew-4"
      PEX: "true"

  tx-indexer:
    image: "ghcr.io/gnolang/tx-indexer@sha256:174d52f27059723c1161a4edff7d15b4d23ed436d7bbcf01f5c219431b0dfbc5"
    container_name: tx-indexer
    restart: unless-stopped
    depends_on:
      validator:
        condition: service_healthy
    ports:
      - 127.0.0.1:8546:8546
    command: start --remote http://validator:26657 --listen-address 0.0.0.0:8546 --db-path /var/lib/app/
    # Indexed data must follow the chain back to block 0: keep it in memory.
    # World-writable because the image does not run as root.
    tmpfs:
      - /var/lib/app:mode=1777

  gnoweb:
    image: ghcr.io/gnolang/gno/gnoweb:master
    restart: unless-stopped
    depends_on:
      validator:
        condition: service_healthy
    ports:
      - 127.0.0.1:8890:8888
    entrypoint:
      - gnoweb
      - --bind=0.0.0.0:8888
      - --remote=http://validator:26657
      - --with-analytics
      - --chainid=dev

  postgres:
    image: postgres:16
    container_name: gnomonitoring-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gnomonitoring
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: gnomonitoring
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gnomonitoring -d gnomonitoring"]
      interval: 5s
      timeout: 5s
      retries: 10

  gnomonitoring:
    build:
      context: ./backend
    container_name: gnomonitoring-backend
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      validator:
        condition: service_healthy
      tx-indexer:
        condition: service_started
    volumes:
      - ./backend/config_dev_chain.yaml:/app/config.yaml:ro
    ports:
      - "127.0.0.1:8880:8888"
      - "127.0.0.1:8989:8989"
    command: ["./server", "--disable-report"]

volumes:
  # Same volume as docker-compose-prod.yml on a local machine, so webhooks,
  # alert contacts and Telegram subscriptions survive across dev runs (only
  # the "dev" chain rows are purged at each start).
  pgdata:
    name: gnomonitoring_pgdata
